name: Foreman
options:
  bundleIdPrefix: com.nambui
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    # Universal app: one binary for Apple silicon and Intel Macs.
    Release:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
targets:
  Foreman:
    type: application
    platform: macOS
    sources: [Sources/Foreman]
    info:
      path: Sources/Foreman/Info.plist
      properties:
        CFBundleName: Foreman
        CFBundleDisplayName: Foreman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:
          - CFBundleURLName: com.nambui.foreman.agent-event
            CFBundleURLSchemes: [foreman]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSAppleEventsUsageDescription: Foreman selects the Terminal or iTerm tab running an agent when you click ↗.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nambui.foreman
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ForemanTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ForemanTests]
    dependencies:
      - target: Foreman
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nambui.foreman.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Foreman.app/Contents/MacOS/Foreman
schemes:
  Foreman:
    build:
      targets:
        Foreman: all
        ForemanTests: [test]
    test:
      targets: [ForemanTests]
      # Assertions check English strings; the host app would otherwise use the saved language.
      commandLineArguments:
        "-AppleLanguages (en)": true
